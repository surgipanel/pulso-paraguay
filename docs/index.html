<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulso Paraguay</title>
  <meta name="description" content="Las noticias de Paraguay agrupadas por acontecimiento, con resumen propio y enlaces a las notas originales de cada medio." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d52b1e'/%3E%3Cpath d='M6 20l5-8 4 6 3-4 4 6h4' fill='none' stroke='%23fff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip" href="#main">Ir al contenido</a>
  <header class="top">
    <div class="wrap top__row">
      <a class="brand" href="#/" aria-label="Pulso Paraguay, portada">
        <svg class="brand__mark" aria-hidden="true" viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="8" fill="#d52b1e"/><path d="M6 20l5-8 4 6 3-4 4 6h4" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="brand__name">Pulso <b>Paraguay</b></span>
      </a>
      <form class="search" role="search" id="search-form">
        <input id="search-input" type="search" placeholder="Buscar en las noticias…" autocomplete="off" aria-label="Buscar" />
      </form>
      <nav class="top__nav" aria-label="Secciones">
        <a href="#/guardadas" data-nav="guardadas">Guardadas <span class="badge" id="saved-count" hidden>0</span></a>
        <a href="#/medios" data-nav="medios">Medios</a>
        <a href="#/archivo" data-nav="archivo">Archivo</a>
      </nav>
    </div>
    <div class="wrap">
      <nav class="cats" id="cats" aria-label="Categorías"></nav>
    </div>
  </header>

  <div class="wrap status" id="status" aria-live="polite"></div>

  <main class="wrap" id="main"></main>

  <footer class="wrap foot">
    <p>Pulso Paraguay agrupa la cobertura de medios paraguayos en acontecimientos y la resume con texto propio. Cada acontecimiento enlaza a las notas originales; el contenido pertenece a cada medio.</p>
    <p id="foot-meta"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
