<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#071C39" />
  <title>Panel de editor | El Prócer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23071C39'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Georgia,Times New Roman,serif' font-weight='700' font-size='16' fill='%23fff'%3EEP%3C/text%3E%3Crect x='7' y='25' width='18' height='2' fill='%23E52531'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Tinos:wght@700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap top__row">
      <div class="brand"><span class="brand__name">EL PRÓCER</span><span class="brand__role">Panel de editor</span></div>
      <div class="who" id="who" hidden><span id="who-name"></span><button class="link" id="logout" type="button">Salir</button></div>
    </div>
  </header>

  <main class="wrap">
    <section class="card" id="login" hidden>
      <h1>Acceso de editor</h1>
      <p class="muted">Solo pueden entrar las cuentas de Google autorizadas.</p>
      <div id="google-button"></div>
      <p class="error" id="login-error" hidden></p>
    </section>

    <div id="app" hidden>
      <section class="card">
        <h2><span class="step">1</span> Buscá la noticia</h2>
        <form id="search-form" class="row">
          <input id="q" type="search" placeholder="Tema o hecho, por ejemplo: Alliana candidatura" maxlength="200" autocomplete="off" aria-label="Tema a buscar" />
          <button class="btn" id="search-btn" type="submit">Buscar</button>
        </form>
        <form id="url-form" class="row">
          <input id="url" type="url" inputmode="url" placeholder="O pegá el enlace de una nota" autocomplete="off" aria-label="Enlace de una nota" />
          <button class="btn btn--ghost" type="submit">Agregar</button>
        </form>
        <p class="status" id="search-status" hidden></p>
        <ul class="results" id="results"></ul>
        <div class="actions" id="draft-bar" hidden>
          <button class="btn" id="draft-btn" type="button">Preparar borrador</button>
          <span class="muted" id="selected-count"></span>
        </div>
      </section>

      <section class="card" id="draft" hidden>
        <h2><span class="step">2</span> Revisá y publicá</h2>
        <ul class="warnings" id="warnings"></ul>
        <label class="field"><span>Título</span><input id="d-title" maxlength="200" /></label>
        <label class="field"><span>Nota <small id="d-words" class="muted"></small></span><textarea id="d-summary" rows="11"></textarea></label>
        <label class="field"><span>Puntos clave <small class="muted">(uno por línea)</small></span><textarea id="d-points" rows="4"></textarea></label>
        <label class="field"><span>Sección</span><select id="d-category"></select></label>
        <div class="field" id="d-image-box" hidden>
          <span>Foto</span>
          <img id="d-image" alt="" referrerpolicy="no-referrer" />
          <label class="check"><input id="d-use-image" type="checkbox" checked /> Usar esta foto <small class="muted" id="d-image-credit"></small></label>
        </div>
        <div class="field"><span>Fuentes</span><ul class="sources" id="d-sources"></ul></div>
        <div class="actions">
          <button class="btn btn--red" id="publish-btn" type="button">Publicar ahora</button>
          <button class="btn btn--ghost" id="discard-btn" type="button">Descartar</button>
        </div>
      </section>

      <section class="card" id="progress" hidden>
        <h2 id="progress-title"></h2>
        <p class="muted" id="progress-text"></p>
        <p id="progress-link" hidden><a id="progress-a" target="_blank" rel="noopener">Ver la noticia publicada</a></p>
      </section>

      <section class="card">
        <h2>Publicadas a mano</h2>
        <ul class="recent" id="recent"></ul>
        <p class="muted" id="recent-empty" hidden>Todavía no hay noticias publicadas desde este panel.</p>
      </section>
    </div>

    <p class="error" id="fatal" hidden></p>
  </main>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="app.js"></script>
</body>
</html>
