name: Actualizar edición

on:
  schedule:
    # Horarios en hora de Asunción (GitHub admite "timezone" por entrada de cron).
    # Minuto 7 en vez de 0: los horarios "en punto" son los más demorados por carga de la plataforma.
    # Una edición completa a la mañana y cuatro actualizaciones. Separadas más de 3 h
    # (la guardia de corridas duplicadas no deja pasar dos del mismo turno más cerca).
    - cron: "7 5 * * *"
      timezone: "America/Asuncion"
    - cron: "37 9 * * *"
      timezone: "America/Asuncion"
    - cron: "7 13 * * *"
      timezone: "America/Asuncion"
    - cron: "37 16 * * *"
      timezone: "America/Asuncion"
    - cron: "7 20 * * *"
      timezone: "America/Asuncion"
  workflow_dispatch:
    inputs:
      force:
        description: "Repetir aunque ya haya corrido este turno (--force)"
        type: boolean
        default: false

# Nunca dos corridas a la vez; la segunda espera a que termine la primera (no se cancela).
concurrency:
  group: pulso-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PULSO_MODEL: ${{ vars.PULSO_MODEL }}
      PULSO_AI_MODE: ${{ vars.PULSO_AI_MODE }}
      PULSO_MAX_EVENTS: ${{ vars.PULSO_MAX_EVENTS }}
      TZ: America/Asuncion
    steps:
      # ref: main → se trabaja sobre el estado de main al ARRANCAR la corrida, no sobre el commit que existía
      # cuando se disparó. Si una corrida esperó en cola detrás de otra, así ve lo que la anterior publicó.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Correr proceso editorial
        id: run
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            node scripts/update.mjs --force
          else
            node scripts/update.mjs
          fi

      # Se publica también cuando el proceso falló: latest.json y runs.json registran el fallo
      # y la web sigue mostrando la última edición válida con su fecha real.
      - name: Publicar datos
        if: always()
        run: |
          git config user.name "procer-bot"
          git config user.email "procer-bot@users.noreply.github.com"
          git add docs/data docs/n docs/sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          git commit -m "Edición $(TZ=America/Asuncion date '+%Y-%m-%d %H:%M') (${{ steps.run.outcome }})"
          # Reintentos limitados por si otro commit llegó mientras corría.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase && sleep 5
          done
          exit 1

      # Publica en X (varios posts por corrida, espaciados) DESPUÉS de que la edición ya está en la web.
      # Sin credenciales se omite; si falla, no afecta la edición.
      - name: Publicar en X
        if: steps.run.outcome == 'success'
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_LINK_MODE: ${{ vars.X_LINK_MODE }}
          X_MAX_POSTS_PER_DAY: ${{ vars.X_MAX_POSTS_PER_DAY }}
          X_CATEGORIES: ${{ vars.X_CATEGORIES }}
          X_POSTS_PER_RUN: ${{ vars.X_POSTS_PER_RUN }}
          X_POST_SPACING_MIN: ${{ vars.X_POST_SPACING_MIN }}
        run: node scripts/publish-x.mjs

      - name: Publicar registro de X
        if: always()
        run: |
          git config user.name "procer-bot"
          git config user.email "procer-bot@users.noreply.github.com"
          cp docs/data/social.json "$RUNNER_TEMP/social.local.json" 2>/dev/null || exit 0
          # Se une con lo que haya en main ahora (otra corrida pudo publicar entre medio): nunca se pierde un registro.
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node scripts/merge-social.mjs "$RUNNER_TEMP/social.local.json" docs/data/social.json
            git add docs/data/social.json
            if git diff --cached --quiet; then
              echo "Sin cambios en el registro de X."
              exit 0
            fi
            git commit -q -m "X: registro de publicaciones $(TZ=America/Asuncion date '+%Y-%m-%d %H:%M')"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
