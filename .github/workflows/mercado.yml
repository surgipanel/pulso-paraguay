name: Actualizar cotizaciones

# Baja la cotización de referencia del BCP (sin IA, sin claves) cada dos horas en días hábiles,
# en horario de Asunción. El BCP publica una vez por día; el dólar interbancario cambia durante la mañana.
on:
  schedule:
    - cron: "23 8-19/2 * * 1-5"
      timezone: "America/Asuncion"
  workflow_dispatch:

concurrency:
  group: pulso-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mercado:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Asuncion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Bajar cotizaciones del BCP
        run: node scripts/mercado.mjs

      - name: Publicar datos
        run: |
          git config user.name "procer-bot"
          git config user.email "procer-bot@users.noreply.github.com"
          git add docs/data/mercado.json
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          git commit -m "Cotizaciones $(TZ=America/Asuncion date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase && sleep 5
          done
          exit 1
